# ---------------------------------------------------------------------------
# GitHub OAuth App 的 client_id —— Device Flow 用。
#
# 它**不是密钥**，明文放这里是 Device Flow 的设计允许的：纯客户端 app 无法
# 安全保存 client_secret，所以这个流程干脆不用 secret。
#
# 注册路径：GitHub → 头像 → Settings → Developer settings → OAuth Apps
#           → New OAuth App
#   ⚠ 不要用旁边的 GitHub Apps —— 那个不支持 Device Flow
#   ⚠ 表单里必须勾上 Enable Device Flow，否则拿设备码时会 403
#   Authorization callback URL 是必填但 Device Flow 不用，填任意 URL 即可
# ---------------------------------------------------------------------------
GITHUB_CLIENT_ID=Ov23li4rIVmmgRKUDgi0
